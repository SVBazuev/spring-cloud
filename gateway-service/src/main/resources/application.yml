server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-swagger-ui
          uri: lb://USER-SERVICE
          predicates:
            - Path=/swagger-ui.html
        - id: user-service-swagger-ui-resources
          uri: lb://USER-SERVICE
          predicates:
            - Path=/swagger-ui/**
        - id: user-service-swagger-resources
          uri: lb://USER-SERVICE
          predicates:
            - Path=/swagger-ui/**
        - id: user-service-swagger-oauth
          uri: lb://USER-SERVICE
          predicates:
            - Path=/swagger-ui/oauth2-redirect.html
        - id: user-service-api-docs
          uri: lb://USER-SERVICE
          predicates:
            - Path=/v3/api-docs/**,/api-docs/**
        - id: user-service-api
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
